<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria zdjęć</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #121212;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .carousel-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    background-color: #1e1e1e;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  .carousel-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .carousel-slide {
    display: none;
    width: 100%;
    height: 100%;
  }

  .carousel-slide.active {
    display: block;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.6);
    color: #ffffff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    transition: background-color 0.2s ease;
    z-index: 10;
  }

  .carousel-btn:hover {
    background-color: rgba(0, 0, 0, 0.9);
  }

  .carousel-btn.prev {
    left: 16px;
  }

  .carousel-btn.next {
    right: 16px;
  }

  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 16px;
    background-color: #1e1e1e;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: #555555;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  .dot.active {
    background-color: #ffffff;
    transform: scale(1.2);
  }

  .touch-hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(0, 0, 0, 0.7);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  .touch-hint.fade-out {
    opacity: 0;
  }
</style>
</head>
<body>

<div class="carousel-container" id="carousel">
  <div class="carousel-viewport" id="viewport">
    <div class="carousel-slide active">
      <img src="https://picsum.photos/id/1018/800/450" alt="Zdjęcie 1">
    </div>
    <div class="carousel-slide">
      <img src="https://picsum.photos/id/1015/800/450" alt="Zdjęcie 2">
    </div>
    <div class="carousel-slide">
      <img src="https://picsum.photos/id/1019/800/450" alt="Zdjęcie 3">
    </div>

    <button class="carousel-btn prev" id="btnPrev" aria-label="Poprzednie">&#10094;</button>
    <button class="carousel-btn next" id="btnNext" aria-label="Następne">&#10095;</button>

    <div class="touch-hint" id="touchHint">Przesuń palcem, aby zmienić</div>
  </div>

  <div class="carousel-dots" id="dotsContainer"></div>
</div>

<script>
(function() {
  const slides = document.querySelectorAll('.carousel-slide');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const dotsContainer = document.getElementById('dotsContainer');
  const viewport = document.getElementById('viewport');
  const touchHint = document.getElementById('touchHint');

  let currentIndex = 0;
  let touchStartX = null;

  slides.forEach((_, index) => {
    const dot = document.createElement('div');
    dot.classList.add('dot');
    if (index === 0) dot.classList.add('active');
    dot.addEventListener('click', () => goToSlide(index));
    dotsContainer.appendChild(dot);
  });

  const dots = document.querySelectorAll('.dot');

  function render() {
    slides.forEach((slide, index) => {
      slide.classList.toggle('active', index === currentIndex);
    });
    dots.forEach((dot, index) => {
      dot.classList.toggle('active', index === currentIndex);
    });
  }

  function goToSlide(index) {
    currentIndex = index;
    render();
    dismissHint();
  }

  function next() {
    currentIndex = (currentIndex + 1) % slides.length;
    render();
    dismissHint();
  }

  function prev() {
    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
    render();
    dismissHint();
  }

  function dismissHint() {
    if (touchHint) {
      touchHint.classList.add('fade-out');
    }
  }

  btnNext.addEventListener('click', next);
  btnPrev.addEventListener('click', prev);

  viewport.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  viewport.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) {
      if (diff > 0) next(); else prev();
    }
    touchStartX = null;
  }, { passive: true });

  render();
  setTimeout(dismissHint, 4000);
})();
</script>

</body>
</html>
